<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Password Reset Complete | FakeCheck</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f4f7fb;
        }

        .card {
            width: 420px;
            background: white;
            padding: 42px;
            border-radius: 16px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
            color: #0b1f3a;
            margin-bottom: 25px;
        }

        .success-icon {
            width: 65px;
            height: 65px;
            margin: 0 auto 20px;
            border-radius: 50%;
            background: #e8f0f8;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 30px;
        }

        h2 {
            color: #1f2937;
            margin-bottom: 15px;
        }

        p {
            color: #6b7280;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 8px;
        }

        .login-btn {
            display: inline-block;
            margin-top: 25px;
            padding: 12px 25px;
            background: #0b1f3a;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
        }

        .login-btn:hover {
            background: #16365f;
        }
    </style>
</head>

<body>

    <div class="card">

        <div class="logo">
            FakeCheck
        </div>

        <div class="success-icon">
            ✓
        </div>

        <h2>Password Reset Complete!</h2>

        <p>
            Your password has been successfully changed.
        </p>

        <p>
            You can now login using your new password.
        </p>

        <a href="{% url 'login' %}" class="login-btn">
            Back to Login
        </a>

    </div>

</body>
</html>
