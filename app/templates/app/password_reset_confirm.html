<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Set New Password | FakeCheck</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f4f7fb;
        }

        .card {
            width: 420px;
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        }

        .logo {
            text-align: center;
            font-size: 28px;
            font-weight: bold;
            color: #0b1f3a;
            margin-bottom: 10px;
        }

        h2 {
            text-align: center;
            color: #1f2937;
            margin-bottom: 10px;
        }

        .description {
            text-align: center;
            color: #6b7280;
            font-size: 14px;
            margin-bottom: 25px;
        }

        form p {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            color: #374151;
            font-size: 14px;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
        }

        input:focus {
            border-color: #0b1f3a;
        }

        .helptext {
            display: block;
            margin-top: 8px;
            color: #6b7280;
            font-size: 12px;
            line-height: 1.5;
        }

        ul {
            margin: 8px 0 0 18px;
            color: #6b7280;
            font-size: 12px;
            line-height: 1.6;
        }

        .errorlist {
            color: #dc2626;
            font-size: 13px;
            margin-bottom: 8px;
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #0b1f3a;
            color: white;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 5px;
        }

        button:hover {
            background: #16365f;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #0b1f3a;
            text-decoration: none;
            font-size: 14px;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        .invalid {
            text-align: center;
        }

        .invalid h2 {
            margin-bottom: 15px;
        }

        .invalid p {
            color: #6b7280;
            font-size: 14px;
            line-height: 1.6;
        }

        .reset-link {
            display: inline-block;
            margin-top: 20px;
            padding: 11px 20px;
            background: #0b1f3a;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
        }

        .reset-link:hover {
            background: #16365f;
        }
    </style>
</head>

<body>

    <div class="card">

        <div class="logo">FakeCheck</div>

        {% if validlink %}

            <h2>Set New Password</h2>

            <p class="description">
                Create a new password for your account.
            </p>

            <form method="POST">
                {% csrf_token %}

                {{ form.as_p }}

                <button type="submit">
                    Change Password
                </button>
            </form>

        {% else %}

            <div class="invalid">

                <h2>Password Reset Link Invalid</h2>

                <p>
                    This password reset link is invalid or has already been used.
                </p>

                <a href="{% url 'password_reset' %}" class="reset-link">
                    Request a New Reset Link
                </a>

            </div>

        {% endif %}

    </div>

</body>
</html>
